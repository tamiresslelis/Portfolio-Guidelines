<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1657c9"/>
      <stop offset="45%" stop-color="#3f8ce0"/>
      <stop offset="100%" stop-color="#a9d8f5"/>
    </linearGradient>
    <radialGradient id="hillLight" cx="62%" cy="0%" r="115%">
      <stop offset="0%" stop-color="#a7e06a"/>
      <stop offset="42%" stop-color="#5cae32"/>
      <stop offset="100%" stop-color="#215f13"/>
    </radialGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
