name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a deploy manually from the Actions tab without a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-flight run
# rather than letting two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # vite.config.ts reads GITHUB_REPOSITORY (set automatically by
        # Actions) to compute the correct /<repo-name>/ base path — no
        # extra env configuration needed here.
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          # The static site TanStack Start's build produces — see
          # vite.config.ts and scripts/postbuild-gh-pages.mjs for how it's
          # assembled. dist/server/ is a build-time implementation detail
          # (used internally to prerender dist/client/index.html) and is
          # never deployed.
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
