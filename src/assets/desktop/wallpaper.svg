<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1857c9"/>
      <stop offset="55%" stop-color="#2f7fe0"/>
      <stop offset="100%" stop-color="#86bced"/>
    </linearGradient>
    <linearGradient id="hillLight" x1="0.35" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#8fd457"/>
      <stop offset="35%" stop-color="#5cae32"/>
      <stop offset="100%" stop-color="#1f5e11"/>
    </linearGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="wispBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>

  <!-- thin, high wispy cirrus streaks -->
  <g filter="url(#wispBlur)" fill="#ffffff">
    <ellipse cx="480" cy="170" rx="260" ry="9" opacity="0.6" transform="rotate(-6 480 170)"/>
    <ellipse cx="610" cy="215" rx="190" ry="7" opacity="0.5" transform="rotate(-4 610 215)"/>
    <ellipse cx="330" cy="230" rx="150" ry="7" opacity="0.4" transform="rotate(-8 330 230)"/>
    <ellipse cx="1460" cy="130" rx="230" ry="8" opacity="0.55" transform="rotate(5 1460 130)"/>
    <ellipse cx="1310" cy="190" rx="170" ry="7" opacity="0.45" transform="rotate(3 1310 190)"/>
  </g>

  <!-- puffy cumulus clusters -->
  <g filter="url(#cloudBlur)" fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="1120" cy="470" rx="200" ry="52"/>
      <ellipse cx="1230" cy="500" rx="140" ry="42"/>
      <ellipse cx="1010" cy="500" rx="120" ry="38"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1640" cy="380" rx="170" ry="46"/>
      <ellipse cx="1750" cy="405" rx="110" ry="34"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="620" cy="150" rx="150" ry="42"/>
      <ellipse cx="720" cy="170" rx="110" ry="34"/>
    </g>
  </g>

  <!-- single continuous rolling hill, cresting left-of-center like the
       reference, with a hazy, gentle secondary rise near the right edge -->
  <path
    d="M0,650 C260,575 470,540 660,558 C930,585 1220,700 1500,790 C1680,845 1830,815 1920,780 L1920,1200 L0,1200 Z"
    fill="url(#hillLight)"
  />
</svg>
