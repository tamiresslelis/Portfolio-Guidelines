      <ellipse cx="630" cy="180" rx="130" ry="42"/>
      <ellipse cx="410" cy="185" rx="110" ry="36"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="980" cy="140" rx="230" ry="55"/>
      <ellipse cx="1120" cy="165" rx="150" ry="42"/>
      <ellipse cx="850" cy="170" rx="130" ry="38"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1620" cy="260" rx="190" ry="50"/>
      <ellipse cx="1750" cy="240" rx="120" ry="38"/>
    </g>
  </g>

  <path
    d="M0,740 C260,660 430,860 760,780 C1040,712 1180,560 1500,660 C1660,710 1800,700 1920,650 L1920,1200 L0,1200 Z"
    fill="url(#hillLight)"
  />
</svg>
